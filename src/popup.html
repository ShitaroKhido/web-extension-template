<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Popup</title>
    <link rel="stylesheet" href="popup.scss">
</head>
<body>
    <div class="container">
        <header>

        </footer>
    </div>
    <script type="module" src="js/popup.js"></script>
